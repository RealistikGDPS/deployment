# Poltergeist production stack. The app and web images come from GHCR; only
# the migrations image is built here. `compose.dev.yaml` builds the rest too.
#
# Only nginx publishes a port. The app and website are reached through it on
# the `proxy` network; MySQL and Redis sit on the `data` network, which is
# internal and therefore has no route to the host or the internet.

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

# Settings every poltergeist-core host needs on top of configuration/app.env
# and configuration/mysql.env. Hostnames are the service names below.
x-core-environment: &core-environment
  MYSQL_HOST: mysql
  MYSQL_TCP_PORT: 3306
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DATABASE: 0
  APP_STORAGE_PATH: /data/storage
  # The images run without a passwd entry for APP_UID; uv wants a writable
  # home, which is the container's private tmpfs.
  HOME: /tmp
  UV_CACHE_DIR: /tmp/uv-cache

# Applied to every container: no capabilities, no privilege escalation, an
# immutable root filesystem with a private /tmp that cannot hold executables,
# a real init as PID 1 so signals and zombies are handled, and enough file
# descriptors for a busy server (Docker's default of 1024 starves nginx and
# MySQL).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  init: true
  tmpfs:
    - /tmp:noexec,nosuid,nodev
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  nginx:
    <<: *hardened
    # Pinned to a line, so a redeploy never jumps a major release unnoticed;
    # bump deliberately. MySQL cannot downgrade a data directory.
    image: nginxinc/nginx-unprivileged:1.31-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      # Docker's embedded DNS. Podman uses a different address; set it in .env.
      NGINX_RESOLVER: ${NGINX_RESOLVER:-127.0.0.11}
      NGINX_GAME_PATH: ${GAME_PATH:-/database}
    tmpfs:
      # Client bodies and proxy buffers; the rendered configuration. Both are
      # explicitly world-writable so the unprivileged nginx user can use them
      # on runtimes that copy the image's ownership onto the tmpfs.
      - /tmp:size=${NGINX_TMP_SIZE:-128m},mode=1777,noexec,nosuid,nodev
      - /etc/nginx/conf.d:mode=1777,noexec,nosuid,nodev
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/cloudflare.conf:/etc/nginx/cloudflare.conf:ro
      - ${DATA_PATH:-./volumes}/storage/songs:/srv/songs:ro
      - ${DATA_PATH:-./volumes}/files:/srv/files:ro
    networks:
      - proxy
    # SIGQUIT drains in-flight requests; SIGTERM would drop them.
    stop_signal: SIGQUIT
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          pids: 64
          memory: ${NGINX_MEMORY_LIMIT:-256m}
    logging: *logging

  app:
    <<: *hardened
    image: ghcr.io/realistikgdps/poltergeist:${POLTERGEIST_TAG:-latest}
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - configuration/app.env
      - configuration/mysql.env
    environment:
      <<: *core-environment
      APP_COMPONENT: fastapi
      APP_HTTP_PORT: 8000
      APP_WORKERS: ${APP_WORKERS:-4}
    volumes:
      - ${DATA_PATH:-./volumes}/storage:/data/storage
    networks:
      - proxy
      - data
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Level uploads and saves in flight get half a minute to finish.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          pids: 256
          memory: ${APP_MEMORY_LIMIT:-1g}
    logging: *logging

  # The public website and, under /admin, the control room. Logging in
  # re-hashes passwords of accounts imported from a 2.1 server. Reads and
  # writes the databases directly, so it sits on both networks; object storage
  # and the game's icon sprites are mounted read-only. It probes the game
  # server's internal health route for the status page.
  web:
    <<: *hardened
    image: ghcr.io/realistikgdps/rgdps-web:${WEB_TAG:-latest}
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - configuration/app.env
      - configuration/mysql.env
      - configuration/web.env
    environment:
      <<: *core-environment
      APP_COMPONENT: web
      APP_HTTP_PORT: 8001
      APP_WORKERS: ${WEB_WORKERS:-2}
      WEB_ASSETS_PATH: /data/assets
      WEB_GAME_SERVER_URL: http://app:8000
    volumes:
      - ${DATA_PATH:-./volumes}/storage:/data/storage:ro
      - ${DATA_PATH:-./volumes}/assets:/data/assets:ro
    networks:
      - proxy
      - data
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          pids: 256
          memory: ${WEB_MEMORY_LIMIT:-1g}
    logging: *logging

  # Runs every pending migration and exits. The app and website wait for it.
  # Built locally from migrations/ so the SQL files ship with this repository
  # rather than through a registry.
  migrations:
    <<: *hardened
    image: poltergeist-migrations
    build:
      context: ./migrations
    restart: "no"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - configuration/mysql.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_TCP_PORT: 3306
    networks:
      - data
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          pids: 64
          memory: 256m
    logging: *logging

  mysql:
    <<: *hardened
    image: mysql:26
    restart: unless-stopped
    # The entrypoint starts as root to take ownership of the data directory,
    # then drops to the mysql user; these are the capabilities that needs.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/run/mysqld:noexec,nosuid,nodev
    command:
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-1G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-150}
      # No replication or point-in-time recovery here, so the binary log is
      # only disk and fsync cost.
      - --disable-log-bin
      # The performance schema costs a few hundred megabytes on its own.
      - --performance-schema=OFF
      # Clients are addressed by IP on the internal network; never do reverse DNS.
      - --skip-name-resolve
      - --local-infile=OFF
      # Nothing here reads or writes files through SQL.
      - --secure-file-priv=NULL
      # SSD storage: bypass the page cache (the buffer pool already caches) and
      # let InnoDB flush at SSD rates rather than the spinning-disk default.
      - --innodb-flush-method=O_DIRECT
      - --innodb-io-capacity=${MYSQL_IO_CAPACITY:-1000}
      - --innodb-io-capacity-max=${MYSQL_IO_CAPACITY_MAX:-2000}
    env_file:
      - configuration/mysql.env
      - configuration/mysql-root.env
    volumes:
      - ${DATA_PATH:-./volumes}/mysql:/var/lib/mysql
    networks:
      - data
    # Pings over TCP on purpose: the image's first-run initialisation runs a
    # temporary server that answers on the socket but has networking off, so
    # a socket ping would report healthy before the real server is up.
    # The password travels in the environment rather than on the command
    # line, where every process in the container could read it.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    # InnoDB needs time to flush; a hurried stop means crash recovery next start.
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          pids: 512
          memory: ${MYSQL_MEMORY_LIMIT:-2g}
    logging: *logging

  # Sessions, rate limits, leaderboards and caches. Everything here can be
  # rebuilt, so an RDB snapshot is enough; no append-only log.
  redis:
    <<: *hardened
    image: redis:8-alpine
    restart: unless-stopped
    # As with MySQL: the entrypoint chowns /data and switches to the redis user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    command:
      - redis-server
      - --save
      - "300 1"
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "no"
      - --tcp-keepalive
      - "300"
    volumes:
      - ${DATA_PATH:-./volumes}/redis:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Time for the final RDB snapshot.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          pids: 64
          memory: ${REDIS_MEMORY_LIMIT:-512m}
    logging: *logging

  # One-shot jobs. Not started by `up`; run with `docker compose run --rm <name>`.
  rebuild-leaderboards:
    <<: *hardened
    image: ghcr.io/realistikgdps/poltergeist:${POLTERGEIST_TAG:-latest}
    profiles: [tools]
    restart: "no"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - configuration/app.env
      - configuration/mysql.env
    environment:
      <<: *core-environment
      APP_COMPONENT: rebuild_leaderboards
    volumes:
      - ${DATA_PATH:-./volumes}/storage:/data/storage
    networks:
      - data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          pids: 64
          memory: 512m
    logging: *logging

networks:
  # nginx and its two upstreams. Not internal: the app fetches song metadata
  # from the official servers, and published ports need external connectivity.
  proxy:
  # Database and cache. Internal: unreachable from the host and the internet.
  data:
    internal: true
